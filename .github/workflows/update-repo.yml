name: Update apt repo

on:
  schedule:
    - cron: "23 * * * *" # hourly, offset from the top of the hour
  workflow_dispatch:
    inputs:
      force:
        description: "Force full pipeline for one package name, or 'all'"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-repo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long

      - name: Update packages and regenerate metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.force }}" ]; then
            ./update-repo.sh --force "${{ inputs.force }}"
          else
            ./update-repo.sh
          fi
